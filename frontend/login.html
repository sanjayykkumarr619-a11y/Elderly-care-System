<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In - Elderly Care System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login" data-public="true">
<div class="auth-page">
  <div class="auth-card">
    <h1>Elderly Care System</h1>
    <div class="subtitle">Medication tracking, camera monitoring &amp; smart home control</div>

    <div class="auth-tabs">
      <button type="button" class="auth-tab active" id="tab-login">Log In</button>
      <button type="button" class="auth-tab" id="tab-register">Create Account</button>
    </div>

    <div class="auth-error" id="auth-error"></div>

    <form id="login-form">
      <label for="login-username">Username</label>
      <input type="text" id="login-username" required autocomplete="username">
      <label for="login-password">Password</label>
      <input type="password" id="login-password" required autocomplete="current-password">
      <button type="submit" class="btn-primary btn-block btn-large" style="margin-top:20px;">Log In</button>
      <div class="form-hint" style="text-align:center;margin-top:14px;">First time here? Try username <strong>demo</strong> / password <strong>demo1234</strong>.</div>
    </form>

    <form id="register-form" style="display:none;">
      <label for="reg-role">I am the...</label>
      <select id="reg-role">
        <option value="PATIENT">Patient (the person being cared for)</option>
        <option value="CARETAKER">Caretaker</option>
        <option value="FAMILY">Family Member</option>
        <option value="DOCTOR">Doctor</option>
      </select>

      <label for="reg-username">Choose a Username</label>
      <input type="text" id="reg-username" required minlength="3" maxlength="30" autocomplete="username">
      <label for="reg-password">Choose a Password</label>
      <input type="password" id="reg-password" required minlength="6" autocomplete="new-password">
      <div class="form-hint">At least 6 characters.</div>

      <div id="patient-fields">
        <label for="reg-caregiver-name">Caregiver / Family Member Name</label>
        <input type="text" id="reg-caregiver-name" placeholder="e.g. Priya (Daughter)">

        <label for="reg-caregiver-email">Caregiver / Family Member Email Address</label>
        <input type="email" id="reg-caregiver-email" placeholder="e.g. priya@example.com">
        <div class="form-hint">Taken / missed / low-stock alerts are emailed to this address.</div>
      </div>

      <div id="linked-fields" style="display:none;">
        <label for="reg-invite-code">Patient's Invite Code</label>
        <input type="text" id="reg-invite-code" placeholder="e.g. AB3D9F2K" style="text-transform:uppercase;">
        <div class="form-hint">Ask the patient for this - they can find it under Settings &rarr; Invite Code.</div>
      </div>

      <button type="submit" class="btn-primary btn-block btn-large" style="margin-top:20px;">Create Account</button>
    </form>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/login.js"></script>
</body>
</html>

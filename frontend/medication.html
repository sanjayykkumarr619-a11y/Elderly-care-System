<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medicines - Elderly Care System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="medication">
<div class="app-shell">
  <div id="sidebar-placeholder"></div>
  <div class="main">
    <div class="topbar">
      <div>
        <h1>Medicines</h1>
        <div class="subtitle">Manage the medicines this system tracks</div>
      </div>
      <button class="btn-primary btn-large role-medication-write" id="add-medicine-btn">+ Add Medicine</button>
    </div>

    <div class="card role-medication-write" id="medicine-form-card" style="display:none;">
      <h3 class="mt-0" id="form-title">Add Medicine</h3>
      <form id="medicine-form">
        <input type="hidden" id="medicine-id">
        <label for="med-name">Medicine Name</label>
        <input type="text" id="med-name" required placeholder="e.g. Tablet A">

        <label for="med-initial-stock" id="initial-stock-label">Initial Physical Quantity</label>
        <input type="number" id="med-initial-stock" min="0" step="any" required>

        <label for="med-threshold">Low Stock Threshold</label>
        <input type="number" id="med-threshold" min="0" step="any" value="5">
        <div class="form-hint">A low-stock alert is created once current stock drops to or below this number.</div>

        <div class="btn-row" style="margin-top:20px;">
          <button type="submit" class="btn-primary">Save Medicine</button>
          <button type="button" id="cancel-form-btn">Cancel</button>
        </div>
      </form>
    </div>

    <div class="card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Name</th><th>Initial Stock</th><th>Current Stock</th><th>Threshold</th><th>Status</th><th>Actions</th></tr>
          </thead>
          <tbody id="medicine-table-body"></tbody>
        </table>
      </div>
      <div class="empty-state" id="medicine-empty" style="display:none;">No medicines yet. Click "Add Medicine" to create one.</div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/medication.js"></script>
</body>
</html>
